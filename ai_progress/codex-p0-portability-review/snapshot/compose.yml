services:
  riskscope:
    build:
      context: .
      dockerfile: Containerfile
    image: riskscope-poc:0.1
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - "riskscope_runtime:/app/runtime"
    environment:
      # 127.0.0.1 inside the container is the container itself, never the Mac
      # host -- host.containers.internal is Podman's host-gateway DNS name,
      # and the only non-loopback hostname app/config.py's local_ollama_url()
      # will accept. Override via a real .env (see .env.example) if your
      # Ollama listens elsewhere; never point this at a non-loopback/non
      # host-gateway or cloud address, it will be rejected by design.
      - OLLAMA_URL=${OLLAMA_URL:-http://host.containers.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:8b}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  riskscope_runtime:
